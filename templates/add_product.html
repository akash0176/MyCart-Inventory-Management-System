{% extends "base.html" %}

{% block title %}MyCart - Add Product{% endblock %}

{% block content %}

<div class="form-container">

    <div class="page-header">
        <div>
            <h1>Add Product</h1>
            <p>Add a new item to your inventory.</p>
        </div>
    </div>

    <form method="POST" class="product-form">

        <div class="form-group">
            <label for="name">Product Name</label>
            <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter product name"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                name="category"
                placeholder="e.g. Electronics"
                required
            >
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    step="0.01"
                    min="0"
                    placeholder="0.00"
                    required
                >
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    min="0"
                    placeholder="0"
                    required
                >
            </div>

        </div>

        <div class="form-group">
            <label for="reorder_level">Reorder Level</label>
            <input
                type="number"
                id="reorder_level"
                name="reorder_level"
                min="0"
                value="5"
                required
            >
            <small>
                You'll be alerted when stock reaches this level.
            </small>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('products') }}" class="cancel-button">
                Cancel
            </a>

            <button type="submit" class="button">
                Add Product
            </button>
        </div>

    </form>

</div>

{% endblock %}
