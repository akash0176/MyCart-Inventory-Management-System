{% extends "base.html" %}

{% block title %}Edit Product - Inventory Management{% endblock %}

{% block content %}

<div class="form-container">

    <div class="page-header">
        <div>
            <h1>Edit Product</h1>
            <p>Update product information and stock.</p>
        </div>
    </div>

    <form method="POST" class="product-form">

        <div class="form-group">
            <label for="name">Product Name</label>
            <input
                type="text"
                id="name"
                name="name"
                value="{{ product['name'] }}"
                required
            >
        </div>

        <div class="form-group">
            <label for="category">Category</label>
            <input
                type="text"
                id="category"
                name="category"
                value="{{ product['category'] }}"
                required
            >
        </div>

        <div class="form-row">

            <div class="form-group">
                <label for="price">Price (₹)</label>
                <input
                    type="number"
                    id="price"
                    name="price"
                    value="{{ product['price'] }}"
                    step="0.01"
                    min="0"
                    required
                >
            </div>

            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input
                    type="number"
                    id="quantity"
                    name="quantity"
                    value="{{ product['quantity'] }}"
                    min="0"
                    required
                >
            </div>

        </div>

        <div class="form-group">
            <label for="reorder_level">Reorder Level</label>
            <input
                type="number"
                id="reorder_level"
                name="reorder_level"
                value="{{ product['reorder_level'] }}"
                min="0"
                required
            >
        </div>

        <div class="form-actions">
            <a href="{{ url_for('products') }}" class="cancel-button">
                Cancel
            </a>

            <button type="submit" class="button">
                Save Changes
            </button>
        </div>

    </form>

</div>

{% endblock %}
